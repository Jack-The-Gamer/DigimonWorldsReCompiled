[package]
name = "dwrc-modhub"
description = "Mod indexes and updates: GitHub-hosted index feeds, release checks, downloads"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dwrc-disc.workspace = true
dwrc-mods.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
hex.workspace = true
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip", "platform-verifier", "win-system-proxy"] }
zip = { version = "5.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
