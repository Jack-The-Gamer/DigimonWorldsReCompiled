name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            exe: DigimonWorldsReCompiled.exe
            cli: dwrc-cli.exe
            script: Play-Windows.bat
          - os: ubuntu-22.04
            name: linux-x64
            exe: DigimonWorldsReCompiled
            cli: dwrc-cli
            script: Play-Linux.sh
          - os: macos-14
            name: macos-arm64
            exe: DigimonWorldsReCompiled
            cli: dwrc-cli
            script: Play-Mac.command
          - os: macos-13
            name: macos-x64
            exe: DigimonWorldsReCompiled
            cli: dwrc-cli
            script: Play-Mac.command
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev
      - name: Test
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --release -p dwrc -p dwrc-cli
      - name: Package
        shell: bash
        run: |
          out=DigimonWorldsReCompiled-${{ matrix.name }}
          mkdir -p "$out"
          cp target/release/${{ matrix.exe }} target/release/${{ matrix.cli }} "$out/"
          cp -r mods docs README.md LICENSE-MIT LICENSE-APACHE ${{ matrix.script }} "$out/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$out.zip" "$out" > /dev/null
          else
            zip -qr "$out.zip" "$out"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DigimonWorldsReCompiled-${{ matrix.name }}
          path: DigimonWorldsReCompiled-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
