name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            exe: DigimonWorldsReCompiled.exe
            cli: dwrc-cli.exe
            script: Play-Windows.bat
          - os: ubuntu-22.04
            name: linux-x64
            exe: DigimonWorldsReCompiled
            cli: dwrc-cli
            script: Play-Linux.sh
          - os: macos-14
            name: macos-arm64
            exe: DigimonWorldsReCompiled
            cli: dwrc-cli
            script: Play-Mac.command
          - os: macos-15-intel
            name: macos-x64
            exe: DigimonWorldsReCompiled
            cli: dwrc-cli
            script: Play-Mac.command
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev
      - name: Test
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --release -p dwrc -p dwrc-cli
      - name: Package
        shell: bash
        run: |
          out=DigimonWorldsReCompiled-${{ matrix.name }}
          mkdir -p "$out"
          cp target/release/${{ matrix.exe }} target/release/${{ matrix.cli }} "$out/"
          cp -r mods docs README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md ${{ matrix.script }} "$out/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$out.zip" "$out" > /dev/null
          else
            zip -qr "$out.zip" "$out"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DigimonWorldsReCompiled-${{ matrix.name }}
          path: DigimonWorldsReCompiled-${{ matrix.name }}.zip

  # Publishes a release when the version in Cargo.toml has none yet (so a
  # release is "bump the version and push"), or when a v* tag is pushed.
  # Notes come from docs/releases/v<version>.md when that file exists.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Decide
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            publish=true
          else
            ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            tag="v$ver"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then publish=false; else publish=true; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ -f "docs/releases/$tag.md" ]; then echo "notes=docs/releases/$tag.md" >> "$GITHUB_OUTPUT"; fi
          echo "release $tag: $publish"
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.publish == 'true'
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Digimon Worlds Re:Compiled ${{ steps.v.outputs.tag }}
          body_path: ${{ steps.v.outputs.notes }}
          generate_release_notes: ${{ steps.v.outputs.notes == '' }}
          files: dist/*.zip
