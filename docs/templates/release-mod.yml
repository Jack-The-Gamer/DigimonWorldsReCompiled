# Publishes your mod as a GitHub Release in the shape Re:Compiled's update
# checks and the mod index look for: a release tagged v<version> with
# <id>-<version>.zip attached, the zip holding an <id>/ folder.
#
# Use: put this file in your mod's repository as .github/workflows/release.yml
# (mod.toml at the repository root) and set `github = "you/your-mod"` in
# mod.toml. Then, to release, bump `version` in mod.toml and push: a version
# without a release yet is published automatically (no tags needed, which
# suits GitHub Desktop). Pushing a v<version> tag works too.
# Files listed with `export-ignore` in .gitattributes are left out of the zip.
name: Release mod

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pack <id>-<version>.zip
        id: pack
        run: |
          id=$(sed -n 's/^id *= *"\([^"]*\)".*/\1/p' mod.toml | head -1)
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' mod.toml | head -1)
          if [ -z "$id" ] || [ -z "$version" ]; then echo "::error::mod.toml needs id and version"; exit 1; fi
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::mod.toml says version $version but the tag is $GITHUB_REF_NAME"; exit 1
          fi
          if [[ "$GITHUB_REF" != refs/tags/* ]] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p "dist/$id"
          git archive HEAD | tar -x -C "dist/$id"
          rm -rf "dist/$id/.github"
          (cd dist && zip -qr -X "$id-$version.zip" "$id")
          echo "zip=dist/$id-$version.zip" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        if: steps.pack.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.pack.outputs.zip }}
          generate_release_notes: true
